<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="leftBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36A0FF"/>
      <stop offset="1" stop-color="#147CE5"/>
    </linearGradient>
    <linearGradient id="rightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#147CE5"/>
      <stop offset="1" stop-color="#0066D6"/>
    </linearGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#24689C" flood-opacity="0.18"/>
    </filter>
    <filter id="paneShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0068C8" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="205" fill="#FFFFFF" filter="url(#tileShadow)"/>
  <rect x="76" y="76" width="872" height="872" rx="201" fill="none" stroke="#E2EDF8" stroke-width="8"/>

  <!-- Two blue windows snapped together on a white canvas. -->
  <g filter="url(#paneShadow)">
    <rect x="230" y="254" width="266" height="516" rx="76" fill="url(#leftBlue)"/>
    <rect x="528" y="254" width="266" height="516" rx="76" fill="url(#rightBlue)"/>
  </g>

  <!-- Minimal white window details, kept bold for Dock-size readability. -->
  <circle cx="286" cy="316" r="12" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="322" cy="316" r="12" fill="#FFFFFF" fill-opacity="0.68"/>
  <rect x="274" y="374" width="178" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="274" y="422" width="132" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.54"/>

  <rect x="568" y="294" width="184" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="568" y="386" width="184" height="324" rx="46" fill="#FFFFFF" fill-opacity="0.34"/>

  <!-- Small snap indicators point toward the shared screen boundary. -->
  <path d="M440 620h34v-34l50 50-50 50v-34h-34z" fill="#FFFFFF" fill-opacity="0.94"/>
  <path d="M584 620h-34v-34l-50 50 50 50v-34h34z" fill="#FFFFFF" fill-opacity="0.94"/>
</svg>
